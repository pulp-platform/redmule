name: lint

on: [ push, pull_request, workflow_dispatch ]

jobs:

  lint-license:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v3
    -
      name: Check license
      uses: pulp-platform/pulp-actions/lint-license@v2
      with:
        license: |
          Copyright (\d{4}(-\d{4})?\s)?.*
          (Solderpad Hardware License, Version 0.51|Licensed under the Apache License, Version 2.0), see LICENSE for details.
          SPDX-License-Identifier: (SHL-0.51|Apache-2.0)
        # Exclude generated headers (no license checker support for optional lines)
        exclude_paths: |
          sw/utils/tinyprintf.h
          sw/inc/*
          *.md
          *.do
          *.lock
          LICENSE*

  lint-sv:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v3
    -
      name: Run Verible
      uses: chipsalliance/verible-linter-action@main
      with:
        paths: rtl
        exclude_paths: |
          rtl/redmule_noncomp.sv
          rtl/redmule_fma.sv
        extra_args: "--waiver_files .github/verible.waiver"
        github_token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_error: true
        reviewdog_reporter: github-check
        log_file: verible-verilog-lint.log
    -
      name: Upload Verible Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lint-sv-artifacts
        path: verible-verilog-lint.log

  lint-verilator:
    runs-on: ubuntu-latest
    env:
      REDMULE_COMPLEX: 0
      VERILATOR_VERSION: "5.046"
    steps:
    -
      name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    -
      name: Install Verilator (prebuilt)
      uses: veryl-lang/setup-verilator@v1
      with:
        version: ${{ env.VERILATOR_VERSION }}
    -
      name: Install bender
      run: make bender
    -
      name: Add installed tools to PATH
      run: echo "$(pwd)/vendor/install/cargo/bin" >> $GITHUB_PATH
    -
      name: Run Verilator lint (width/latch/loop checks gated as errors)
      run: |
        make hw-script target=verilator
        # ENUMVALUE/MODDUP/BLKANDNBLK are pre-existing, intentional patterns in this
        # design (see verilator.mk) and default to fatal errors that would otherwise
        # abort elaboration before it reaches the checks below.
        verilator --lint-only -Wall \
          -Wno-ENUMVALUE -Wno-MODDUP -Wno-BLKANDNBLK \
          --top-module redmule_tb_wrap \
          -GHeight=8 -GWidth=8 -GPROB_STALL=0.0 \
          -Werror-WIDTHTRUNC -Werror-LATCH -Werror-UNOPTFLAT \
          target/sim/verilator/lint_waiver.vlt \
          -f target/sim/verilator/compile.verilator.tcl \
          2>&1 | tee verilator-lint.log
        exit ${PIPESTATUS[0]}
    -
      name: Upload Verilator Lint Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-verilator-artifacts
        path: verilator-lint.log

  lint-cxx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install clang-format
        run: sudo apt-get install -y clang-format-14

      - name: Run Clang-format and create patch
        run: |
          find . -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' \) ! -path './sw/inc/*' ! -path './sw/utils/tinyprintf.h' \
            -exec clang-format-14 --dry-run --Werror {} + 2> clang_format_output.txt || true
          find . -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' \) ! -path './sw/inc/*' ! -path './sw/utils/tinyprintf.h' \
            -exec clang-format-14 -i {} +
          git diff > clang_format_patch.diff

      - name: Upload Clang-format Output
        uses: actions/upload-artifact@v4
        with:
          name: clang-format-report
          path: |
            clang_format_output.txt
            clang_format_patch.diff

